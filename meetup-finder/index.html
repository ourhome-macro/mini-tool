<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友聚会地点查找器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎯 朋友聚会地点查找器</h1>
            <p class="subtitle">输入朋友们位置，找到最适合的聚会地点</p>
        </header>

        <div class="main-content">
            <aside class="control-panel">
                <div class="panel-section">
                    <h3>📍 添加位置</h3>
                    <div class="input-group">
                        <input type="text" id="locationInput" placeholder="输入地址，如：北京市朝阳区" />
                        <button id="addLocationBtn" class="btn btn-primary">添加</button>
                    </div>
                    <div id="locationList" class="location-list"></div>
                </div>

                <div class="panel-section">
                    <h3>⭕ 搜索半径</h3>
                    <div class="radius-control">
                        <input type="range" id="radiusSlider" min="1" max="20" value="5" step="0.5" />
                        <span id="radiusValue">5</span> km
                    </div>
                </div>

                <div class="panel-section">
                    <h3>🔍 POI类型</h3>
                    <select id="poiType" class="select-input">
                        <option value="050000">餐饮服务</option>
                        <option value="060000">购物服务</option>
                        <option value="080500">咖啡馆</option>
                        <option value="080400">茶艺馆</option>
                        <option value="110000">风景名胜</option>
                    </select>
                </div>

                <div class="panel-section">
                    <button id="searchBtn" class="btn btn-search" disabled>
                        🔎 搜索聚会地点
                    </button>
                </div>

                <div class="panel-section">
                    <h3>📋 推荐地点</h3>
                    <div id="poiList" class="poi-list"></div>
                </div>
            </aside>

            <main class="map-container">
                <div id="mapContainer"></div>
                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>加载中...</p>
                </div>
            </main>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
    <script>
        window.onload = function() {
            App.init();
        };
    </script>
</body>
</html>
